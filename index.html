<script>
const _x=0;
const CASES=[
{id:"renewal",title:"One-click renewals that kept half the policies",pv:"50.9% of policies renewed",
meta:"Only designer · 2026",
card:"A year after we launched annual car insurance, the first policies were about to expire, and each one depended on a busy broker remembering it. I made renewing take one click. Half the drivers stayed, and the data showed where the rest slipped away.",
intro:"In Brazil, most car insurance is sold by brokers, independent advisers who look after dozens of drivers at once. When our first annual policies came up for renewal, each one depended on a broker remembering, quoting again and sending a new proposal in time. Miss the date and the driver was simply uninsured. I redesigned renewal so the broker only has to say yes.",
stats:[["50.9","renewal rate in the first months"],["96.5","of proposals sent became policies"]],
quote:"Renewal can’t be automatic. So it had to be effortless.",
hctx:"The easiest sale was also the easiest to lose",
ctx:"For a broker, a customer who renews is the easiest money of the year. But renewals arrive all at once, mixed with new sales and support calls, and brokers usually start only ten to fifteen days before the deadline. By law, every renewal is a new contract with a new price, so it can never happen on its own. If the broker gets busy, the driver ends up without coverage.",
hrole:"The only designer, from first sketch to support training",
role:"I was the only designer on the project. I defined the scope with the product manager, designed the broker portal, the customer app and the internal tools, tested everything before launch and trained the support team. Legal and the risk team approved the rules before I drew a single screen.",
happ:"Brokers had already told me what makes them act",
app:"I had interviewed brokers months earlier, and three things stuck. They leave renewals for the last minute. They almost always compare prices again before renewing. And their commission is what moves them. So the design had to do the boring work for them, put the new price next to last year’s and keep their commission in view. Before opening Figma, I settled the tricky cases one by one: a new car, a discount, a late renewal, a switch to the monthly plan. I also used an internal AI assistant to check the rules, and caught it mixing up two of them on launch day.",
hdec:"The system prepares, the broker decides",
shots:[["renewal-one-click.png","Renewal screen with last year’s and this year’s price side by side, a commission slider and the policy data already filled in","The one-click screen. The broker sees last year’s price next to this year’s, adjusts commission and sends. Sample data."],["renewal-list.png","Renewals page listing policies with status and days left until expiry","The renewals page, ranked by days left until expiry. Customer details are blurred."],["renewal-competition.png","Alert saying other brokers are quoting the broker’s customers, with a customer card and the broker’s advantages: lower price, commission range and one-click renewal","When other brokers start quoting customers from the broker’s book, the portal flags it and shows what the broker gains by renewing now. Sample data.","narrow"],["renewal-commission.png","Commission opportunity alert with eligible renewals, current and potential earnings, options of +3%, +5% recommended and +7%, and a button to apply to all eligible renewals","The commission opportunity: the portal finds renewals with room for a higher commission, recommends an increase and applies it to all of them at once. Sample data.","narrow"]],
dec:[["The system prepares the renewal. The broker just decides.","Renewing automatically, with no one in the loop","The price can change, so a person has to own the decision. A renewals page lists policies by how soon they expire, and one click opens the new offer next to the current one, already filled in."],
["Nudges that give brokers a reason to act now.","A plain to-do list of renewals","The portal warns when other brokers are quoting one of their customers. It also spots renewals where they could earn a bit more commission and still offer the best price."],
["A new car or driver means a new quote.","Editing the old offer","Those changes change the risk, so the old price no longer holds. Smaller edits, like commission or coverage, just update the existing offer."],
["Fifteen days of grace after the policy ends.","Asking for a new car inspection","We already had last year’s photos. The risk team and I accepted that on purpose, so a late broker doesn’t lose the customer."]],
hout:"Half renewed, and almost every proposal sent closed",
out:"In the first months, <strong>50.9%</strong> of the drivers who could renew did. Of the proposals brokers actually sent, <strong>96.5%</strong> became policies. Price, brokers and communication also move these numbers, so I don’t credit design alone.",
href:"Look for the loss before polishing the last step",
ref:"I worked hard to make the final click effortless. Then the numbers showed that almost everyone who gets that far renews. The real loss happens earlier, in the days when the broker hasn’t looked yet. Next time, I’d measure that gap before designing the last screen. That question became the next project: renewals a broker sets up once and the system sends on time. I held my own forecast to the same standard. I surveyed 219 brokers, and the answers cut my expected gain from 4.8 to about 2.3 percentage points. My first number had been a ceiling, not a forecast."},
{id:"assessorias",title:"A portal rebuilt in a month, with my first code",pv:"Live before the contract ended",
meta:"Product owner, designer and developer · 2026",
card:"The tool behind our partners’ portal was about to be switched off, and it was where they saw how much they would be paid. I redesigned the portal and wrote part of the code myself, for the first time. It went live two days before the deadline.",
intro:"Many brokers work under advisory firms, companies that support a network of brokers and get paid for what that network sells. Every month, those firms open our portal to see who sold what and how much they will earn. The tool behind that portal had a contract about to end, and nothing would replace it unless we built it. I redesigned the portal and, for the first time in my life, wrote part of its code. <strong>It went live two days before the contract ended.</strong>",
quote:"I had never written code. The deadline didn’t care.",
hctx:"A fixed deadline and nothing underneath",
ctx:"These partners bring in a meaningful share of our sales, and the portal shows how much they invoice us each month. If it went dark, they would be blind to their own business. The CTO chose to build a proper replacement instead of a quick copy. The catch: the old portal read straight from our database, so none of the connections the new one needed existed yet.",
hrole:"Designer, product owner and, for the first time, developer",
role:"I mapped the old portal, designed the new one and wrote production code for several screens, including the one partners use to see their earnings. A product manager coached me through my first weeks with an AI coding assistant and wrote about half of the front end. Engineers reviewed and approved everything I wrote before it went live.",
happ:"Map every screen to the data behind it",
app:"Before drawing anything, I went through the live portal and documented its 11 screens, down to every filter, column and button. Then I built a clickable prototype. When engineering told me the data behind those screens didn’t exist yet, I reorganized the plan so the backend came first. Every design round went out with a map showing where each number on the screen would come from.",
hdec:"Rebuild what exists, and nothing more",
shots:[["assessorias-home.png","Agencies portal home with six cards for the broker funnel: signed up, accessed, quoted, no quote, sold and total policies","The home shows an advisory firm its broker funnel at a glance: signed up, accessed, quoted, sold. Real data is hidden."],["assessorias-production.png","Production screen with a closed month selected, cards for policies, commission and net premium, and a table of policies","The Production screen, the one that matters for money. A closed month is frozen and shows the amount for the invoice. Real data is hidden."]],
dec:[["Only what the old portal already did.","Adding new features on the way","With a fixed deadline, launch day only had to match the old portal. Every new request went on a list for later."],
["A separate portal for partners.","One portal for partners and brokers together","Partners and brokers sign in differently. Putting both in one product meant running two sign-in systems side by side."],
["Our internal team’s view moved to our internal tools.","One portal serving two audiences","Our operations team needed a different menu and different screens. Moving that view out also removed a decision we didn’t need to make."]],
hout:"Live two days before the deadline",
out:"Partners told their account managers what was missing, and I fixed most of it in code that same day. The old tool was switched off the next day. From my first line of code to production took <strong>under a month</strong>.",
href:"What launch day taught me",
ref:"On launch day, one screen left out some brokers. The new screen pulled data in a way the old one never had. That’s when I learned that moving a screen also means moving where its data comes from. Now, before any release, I check every change it carries and stop if one isn’t mine."},
{id:"assist",title:"A tow truck customers can watch arrive",pv:"Live tracking in the app",
meta:"Product designer · 2024",
card:"Roadside assistance was the service our customers used most, and ours left them waiting without a word. With a new on-demand towing network, I redesigned the app so someone stuck on the road can ask for help and watch it arrive.",
intro:"Roadside assistance was the service our customers used most, and the most urgent one. Ours relied on phone queues and gave no sign of when help would come. When the company switched to an on-demand towing network, I redesigned the assistance experience in the app, from the request to watching the tow truck arrive. It was my first project at the company.",
stats:[["5","of customers used roadside assistance each month, against 1.8% who filed a claim"],["70","of requests went through the phone, where we couldn’t see what was sent"]],
quote:"Someone stuck on the side of the road has one question: when does help arrive?",
hctx:"Waiting on the roadside without a word",
ctx:"Customers waited a long time just to get someone on the phone. Then many had no idea whether help would arrive in 30 minutes or in 3 hours, so they felt abandoned. With the old provider, the slowest 5% of requests waited about 15 hours. Most requests went through the phone, so we couldn’t control which solution was sent. The company decided to switch to an on-demand towing network, a kind of Uber for tow trucks, with a goal of having 95% of services arrive within 150 minutes.",
hrole:"Product designer, in a pair with the operations PM",
role:"I was the product designer for the app experience, working in a pair with the operations product manager. I ran the discovery on customer feedback, set the design criteria, designed the request and tracking flows and planned how to validate them.",
happ:"What people stuck on the road actually ask for",
app:"I analyzed three months of assistance feedback, both ratings and comments. Customers asked for four things: help within one or two hours, a way to request and track it in the app without calling anyone, quick answers and clarity about extra costs like taxi, hotel or parts. I also looked at how other insurers handled it. One showed how many uses of each service were left, another a live timeline of every event, another asked a few questions to prioritize urgent cases. A customer’s account of feeling vulnerable and unsafe while waiting made tracking a requirement.",
hdec:"Give the customer back a sense of control",
shots:[["assist-tracking.png","Three app screens showing the estimated arrival time, a map with the tow truck and the provider’s details","Live tracking in the app: estimated arrival, provider details and a map that updates as help moves. Sample data.","phones"]],
dec:[["Three non-negotiable criteria: easy to request, always visible, no surprises on cost.","Polishing screens one by one","Every design choice was checked against the same three questions. Can I ask for help without calling? Do I know where help is right now? Do I know what is covered and what I might pay?"],
["An open request takes over the home screen.","Keeping tracking inside the assistance menu","Someone on the roadside opens the app to know one thing. The home screen shows the estimated arrival, the provider’s details and the live location until help arrives."],
["Release in phases, behind feature flags.","Switching every assistance type at once","The first release covered battery and towing requests through the app, with a tracking link by text message, limited by region and share of customers. Live tracking in the app and the other services came next."],
["Show usage limits and possible extra costs up front.","Explaining costs only after the service","Customers asked for clarity about what is covered. A surprise charge at the worst moment of someone’s day undoes everything else the flow gets right."]],
hout:"Help you can watch arrive",
out:"The new provider took over roadside assistance, and customers could follow the tow truck live in the app, from the estimated arrival to the provider’s name. Before the switch, the proof of concept had estimated savings of about 17% on assistance costs.",
href:"Design for the worst moment of someone’s day",
ref:"This was my first project at the company, and it taught me the product from the inside: assistance, operations and what a customer feels at the worst moment of their day. In an urgent flow, the most useful thing an interface can give is certainty about what happens next."},
{id:"account",title:"From forgotten code to a discount brokers spend",pv:"57% of brokers applied a discount",
meta:"Product owner and designer · 2026",
card:"Brokers lose sales over price every day. We had a way to let them offer discounts, but it lived only in code. I turned it into a balance they can see and spend, and changed my mind about where they spend it.",
intro:"Picture a broker about to lose a customer over the price of a quote. Brokers who sell well with us earn a monthly balance, in reais, to give discounts. The rules for it already existed, but no broker could see or use that money. I designed the screens and the rules that put the balance in their hands.",
stats:[["57","of eligible brokers who quoted applied a discount, up from 49%"],["51","of brokers with a balance never used it, down from 60%"]],
quote:"",
hctx:"A discount nobody could use",
ctx:"Price is one of the objections brokers hear most. The company bet that a discount in their hands would close more sales. But the discount engine existed only as business rules and code that nothing called. Brokers were earning something they couldn’t see, let alone spend.",
hrole:"I owned the decisions and answered for them",
role:"I owned the product definition. I made the product, design, copy and scope calls and answered for them to the revenue, sales and engineering leads. I worked with the CTO and a founder on the pricing engine, and with engineers on the build.",
happ:"The model changed under my feet",
app:"I started by reading the engine’s documents and code to see what already existed, and designed a first version. Then the model changed from fixed credits to a balance in reais, so I rewrote the whole definition in a day. With sales and revenue, I named it the ‘current account’, a term brokers already use for money they can draw on. Then I built a clickable prototype for the two leaders who own the business rules. The first beta went out with the engine switched off, so no broker saw the discount. We pulled it and relaunched.",
hdec:"Show the limit, never block the sale",
shots:[["account-quote-discount.png","Last-details step of the quote with a slider to apply the current account discount, the maximum discount, the customer’s saving and the price summary","The discount at the quote step: a slider capped at the broker’s ceiling, with the reason written right below, and the summary updating as it moves. Sample data."],["account-balance.png","Financial menu with the current account tab: monthly balance with used and available amounts, a how-to card and a history table of discounts and refunds","The current account in the Financial menu: this month’s balance, how to use it and every discount and refund in the history. Sample data, with client names blurred."],["account-simulator.png","Commission simulator bar from 10% to 30% with the broker’s commission, the discount the customer can get and the space up to the ceiling","The commission simulator: the broker drags the divider and sees how much room is left for a discount, up to the ceiling."]],
dec:[["A slider that shows the ceiling and why.","A discount field with no explanation","A broker who reads ‘Your ceiling is 8% because commission plus discount can’t pass 20%’ understands that the limit is something they control."],
["Hold the balance only when the proposal is sent.","Holding it while the broker is still quoting","Quotes that never turned into sales were locking up money. Moving the hold to the proposal freed all of it."],
["Discounts while quoting, after saying no twice.","Discounts only at the very end","I first kept the discount for the end, because the balance is shared and the quote PDF is a promise to the customer. When complaints kept coming, I designed the quoting version in three days, with a preview that holds nothing."],
["The balance belongs to the brokerage, and the whole team spends it.","A balance per login","The first version tied the balance to each login, so brokerages with a team split it without meaning to."],
["The engine never blocks a sale.","Stopping the quote when the engine fails","A problem with a discount should never stop a broker from selling."]],
hout:"More brokers use it. Few quotes carry it.",
out:"In the first full month, <strong>57%</strong> of eligible brokers who quoted used a discount, up from 49%. Brokers who never touched their balance fell from 60% to 51%. Still, only 0.9% of quotes carry a discount. The number that will settle the bet is whether discounted quotes close more often.",
href:"Changing my mind with data",
ref:"I said no twice, each time with reasons. When the volume of complaints made the case, I redesigned in three days. I changed my mind because the evidence did. One question is still open: brokers already at 20% commission can’t use the discount at all. That’s a pricing decision, so I raised it and left it with the people who set prices."},
{id:"annual",title:"The annual policy that grew to 89% of new sales",pv:"89% of new sales are annual",
meta:"Product designer · 2025",
card:"We only sold a monthly plan that drivers could drop any month. I designed the launch of a 12-month policy, including the odd moment when a customer has paid but the policy isn’t final yet. Sixteen months later, it was 89% of new sales.",
intro:"We started out selling car insurance like a subscription: monthly, easy to cancel and easy to lose. The annual policy changed that. It gave brokers a customer to keep and something to renew. But it asked more of the driver before it started: pay first, maybe book an inspection or install a tracker, then drive 80 km with our app on. I designed that launch across the broker portal, the customer app and our internal tools.",
stats:[["15","of new sales at launch"],["89","of new sales 16 months later"]],
quote:"A paid proposal is not yet a policy.",
hctx:"A better product with a harder start",
ctx:"Until every step was done, the customer was covered provisionally. Brokers had to explain it, support had to answer for it and customers had to trust it. A driver who didn’t understand that in-between state could feel unprotected right after paying, which is exactly what broker managers feared.",
hrole:"Three products and the people behind them",
role:"I designed the broker portal, the customer app and the internal tools with the insurance product manager. I wrote the test plan and trained the broker managers and the support team. I prepared the launch with the engineers who built each piece.",
happ:"I listened to the people who would have to explain it",
app:"Two weeks before launch, I trained the broker managers and turned each of their worries into an action. Would customers coming from other insurers keep their no-claims discount? Would anyone be left uncovered while waiting for an inspection? Would customers install the app fast enough? A week before launch, I went through testing with the product manager, one product at a time, and wrote down why each fix mattered.",
hdec:"One idea for everyone to learn",
dec:[["Steps of one proposal, not new kinds of coverage.","A different coverage name for each missing step","Provisional coverage, pending inspection, pending tracker and pending driving test are all steps of the same proposal. Brokers, support and customers only had to learn one idea."],
["The type of policy visible everywhere.","Showing monthly and annual the same way","Support had to tell the two products apart at a glance. During testing, I asked for a policy type column and the tracker status in the proposals table."],
["A brand-new car without a plate goes to a person.","Blocking the quote","It’s rare and the operations team can handle it by hand. I didn’t want to stop a legitimate sale."]],
hout:"From 15% to 89% of new sales",
out:"We launched to a small group of brokers and opened to everyone a week later. Annual went from 15% of new sales at launch to <strong>89%</strong> sixteen months later. Price and broker incentives also drove that share, so I don’t credit design alone.",
href:"Fix the words before the screens",
ref:"I fixed the vocabulary early. The monthly product is a ticket. The annual one is always a policy. When two products live side by side, using the same words everywhere prevents more confusion than any screen."},
{id:"onboarding",title:"640 conversations that showed where new brokers stall",pv:"1 in 5 brokers never replies",
meta:"Co-owner of the research · 2026",
card:"New brokers sign up, get approved and then go quiet. To find out why, I read 640 real conversations instead of a sample. The ‘welcome’ message they got turned out to be a request to book a call.",
intro:"A new broker signs up, gets approved and is ready to sell. Then, often, nothing happens, and nobody knew why. I co-led a research project that read 640 real WhatsApp conversations between new brokers and the people who welcome them, and mapped what happens week by week. It became the base for an AI agent that will welcome new brokers.",
stats:[["75","of first messages ask to book a call"],["20","of new brokers never reply"]],
quote:"I heard conversations, not people.",
hctx:"Brokers signed up and then went quiet",
ctx:"The company wanted more brokers who actually sell. Onboarding was done by hand, and one remote account manager could properly look after about half of each month’s new brokers. First contact came 6.5 days after approval, while the internal guide promised one day. The question for the quarter was simple: where do new brokers get stuck?",
hrole:"Co-owner of the research",
role:"I co-owned the project with the product manager. I mapped the journey, built the service blueprint, read conversations and checked the behind-the-scenes steps with the people who run them. Five colleagues helped me read everything.",
happ:"From the official process to the real conversations",
app:"I started with the documented process and mapped how onboarding was supposed to work. Then five readers went through 640 WhatsApp conversations from start to finish. I transcribed 149 voice messages on my own computer, so no personal data ever left it. Finally, I checked each behind-the-scenes step with the teams involved and compared the guide with what really happened.",
hdec:"Read everything before proposing anything",
shots:[["onboarding-blueprint.png","Service blueprint with six stages across lanes for broker actions, touchpoints, front stage, backstage, systems and pain points, plus a chart comparing playbook and observed time per stage","The service blueprint: six stages across nine lanes, from what the broker does to what happens behind the scenes, with the playbook and reality side by side. Team names and internal tools are blurred."]],
dec:[["Read everything, not a sample.","Searching the conversations by keyword","Keywords only find what you already expect. Reading in full showed that the welcome message was really a request for a call. No keyword would have found that."],
["When two teams disagree, trust the person who does the work.","Giving every source the same weight","Two teams described sign-up differently. I went with the person who actually approves the registrations."],
["Map the journey and leave fixes for later.","Proposing a fix for every pain point","This phase was about understanding. The fixes belong to the next project."]],
hout:"Four findings the guide didn’t predict",
out:"The blueprint covers six stages, from first contact to an active portfolio, with the official guide and reality side by side. <strong>75%</strong> of welcome messages ask to book a call. <strong>20%</strong> of new brokers never reply. Setting up the tool brokers use to compare insurers takes 14 to 30 days without help, against 2 in the guide. And approval, which everyone worried about, is almost never the complaint. The real pain is the app and the driving score their customers deal with.",
href:"What this research can’t tell me",
ref:"This research shows what brokers ask, but not why, or how they feel. Interviews with newly approved brokers are the missing piece. I’d run them before any redesign."},
{id:"itau",title:"Helping Itaú prevent debt instead of chasing it",pv:"4 credit profiles, one preventive strategy",
meta:"UX research and strategy · Service design consulting · 2022",
card:"Itaú’s recovery area wanted to step in before customers fell into long debt. My research found four ways people relate to credit and helped turn ‘prevention’ from a vague goal into guidelines for every stage of the credit cycle.",
intro:"Debt in Brazil is a mass problem. By the end of 2025, Serasa counted about 81 million people in default, roughly half the adult population. At Itaú, roughly 30% of customers carried some debt, and the recovery area wanted to act while a late payment was still short. I worked on UX research and strategy to define what ‘preventive’ should mean for the bank, and for whom.",
quote:"The best recovery is the one the customer never needs.",
hctx:"A recovery area that wanted fewer customers to recover",
ctx:"The area was measured on regularization, digital share and cost. One stakeholder put it plainly: the team was judged mostly by digital share, and its digital channel still wasn’t where most customers negotiated. At competitors, it was. The bank had no clear strategy for prevention, and the word meant something different to each person: a reminder text before the due date, financial education, a new product. Without a definition, every area could claim prevention and none could act on it.",
hrole:"UX research and strategy",
role:"My role was UX research and strategy, in a consulting team working with Itaú’s recovery area. I worked on the benchmark, interviewed customers in pairs with the team and helped synthesize what we heard into profiles, a journey and the final guidelines.",
happ:"Stakeholders, a benchmark, then the customers",
app:"We started with stakeholder interviews to collect what the area wanted to learn. One of their questions: what would make a customer with their last R$ 1,000 renegotiate with Itaú instead of a competitor? In parallel, I helped consolidate a benchmark. Then we interviewed account holders and non-account holders with credit card, personal loan or overdraft debt up to 30 days late. One hypothesis guided the script: dealing with debt has a high emotional cost, so renegotiating should take as little mental and emotional effort as possible. The interviews revealed four ways people relate to credit, on two axes: how much they plan their finances and how much they resist changing habits.",
prof:[["The optimist","“I have to pay rent anyway. I put it on the card and still earn miles.”","Less planned · resists change"],["The planner","“Cash in hand is negotiating power.”","More planned · resists change"],["The flexible","“You can’t do everything. You have to prioritize.”","Less planned · open to change"],["The rational","“With a bank I know I’ll be treated as just another number. That’s why I choose fintechs.”","More planned · open to change"]],
hdec:"Define prevention before designing for it",
shots:[["itau-workshop.png","Workshop board with three horizons labeled incremental, disruptive and radical innovation","A board from a prioritization workshop with the client: options sorted into three horizons, from incremental to radical innovation. Names and notes are blurred."]],
dec:[["Prevention is a culture across the whole credit cycle, with different actions for each phase and profile.","Treating prevention as one action, like a reminder text, or as financial education alone","A single touchpoint can’t keep someone out of debt. Writing down what prevention is and what it isn’t gave every area the same target."],
["Start from the four credit profiles.","Starting from channels or products","People react differently to the same nudge. The profiles showed which action fits whom, from the moment credit is taken to the first days of a late payment."],
["Service design guidelines as the final deliverable.","A product concept prototype, or a facilitation workshop","We put three paths in front of the client and voted together on what mattered most for the area. The gap sat between strategy and the day to day, so the team needed guidelines it could apply in every channel."],
["Go deep on one moment and one profile.","Covering every phase and profile at the same depth","The guidelines focused on the first 30 days late, while the debt is still short, for one profile. A deep, usable cut was worth more than a shallow map of everything."]],
hout:"From a buzzword to guidelines the area could use",
out:"The final delivery turned prevention into a working definition, a journey of the four profiles across the credit cycle and communication guidelines for the first 30 days late. For each moment, the guidelines covered what the customer expects to hear, how Itaú should behave, which channels to use and what triggers each message. They started from the questions customers ask in that window, like ‘how can I trust the bank is helping me make the best decision for me?’ Before that, the area had already received a diagnosis, an emotion map and the credit-cycle journey.",
href:"Name the thing before you design it",
ref:"The research was the easy part. The hard part was getting a whole area to agree on what one word meant. Writing down what prevention is and what it isn’t aligned more people than any screen would have."},
{id:"nestle",title:"One ecosystem for Nestlé Brazil’s brand sites",pv:"Brand sites unified on one platform",
meta:"UX research and strategy · Product strategy consulting at Thoughtworks",
card:"Nestlé Brazil ran its brands’ sites and digital products on separate strategies. I worked on the research and strategy to unify them and owned the five-year product roadmap. The program later unified the brands’ campaign sites on a single platform.",
intro:"Nestlé Brazil ran its brands, platforms and digital products on separate strategies. The consumer met a different experience on each site, and data was hard to collect and connect. I worked on UX research and strategy for one unified ecosystem and owned its five-year roadmap.",
quote:"",
hctx:"Traffic that never became data",
ctx:"Each brand ran its own campaign sites and digital products. Sites with similar purposes followed separate strategies, so the experience changed from one to the next and most visits never became usable data. At the same time, Nestlé had publicly committed to building first-party consumer data at scale. In 2021 it set out to double its consumer data records in four years, just as third-party cookies were being phased out.",
hrole:"UX research and strategy",
role:"My role was UX research and strategy. I refined the product vision and shaped one strategic objective for the ecosystem. I mapped the business, the users and the market, including opportunities competitors had not taken yet. I owned the five-year roadmap.",
happ:"Seven areas and every region of Brazil",
app:"I interviewed stakeholders from seven areas and customers from every region of Brazil, and the team ran a workshop with six areas. We started from five hubs, each with its own site, with audiences and efforts that overlapped. The research had to answer one question: which hubs stay and which go. Then we sketched the ideal ecosystem, built wireframes, chose the features with dot-voting and defined how each product feeds the brand’s data lake.",
hdec:"One hub out, three merged, one kept",
dec:[["One hub out, three merged, one kept.","Keeping all five hubs, each with its own site","Research showed one hub wasn’t a priority. People saw similar value in the three promotional hubs (promotions, club and Eu Quero Nestlé), so we merged them into one. Recipes stayed as it was: its value was clear and it already brought people in."],
["The consumer at the center, in one logged-in core.","Letting each hub keep its own sign-up","A single logged-in area concentrates sign-up and the relationship. It keeps people in the ecosystem and gives every hub the same view of the consumer."],
["A boundary with rules for getting in.","Letting any new hub join","A new hub goes where its strategy fits: benefits, content and community, or data. Criteria decide whether a hub stays, closes or gets created."],
["Data enrichment in every exchange.","Treating the data lake as storage only","The data lake surrounds everything, and each exchange between hubs adds behavior and consumption data. That enrichment is what makes the ecosystem work."]],
hout:"From one vision to platforms in production",
out:"Stakeholders from seven areas aligned on one product vision, and user validation asked only for minor adjustments. The ecosystem drawing went from scattered hubs side by side to a target, with the consumer at the center. In 2026 Nestlé Brazil and Thoughtworks announced the results of the program: brand campaign sites unified on the Eu Quero Nestlé Promoções platform, a health hub called Nutrição Até Você and a design strategy with a complete product roadmap. Nestlé also adopted product thinking to manage its digital ecosystem as something that keeps evolving.",
href:"Unify the data before the screens",
ref:"The visible problem was too many sites. The real one was that each site collected data its own way. Framing the work around one data flow gave every area the same reason to support a single platform."},
{id:"santander",title:"Where Santander Esfera’s redemption flow breaks",pv:"Every path mapped",
meta:"UX research and strategy · UX consulting",
card:"Nobody at Santander Esfera could see the full path from finding a reward to paying for it. I reconstructed it screen by screen, edge cases included, and showed where it broke.",
intro:"Esfera is Santander’s loyalty program. Cardholders buy points, browse a catalog and redeem them for products and vouchers, or use them with partners. The business had no clear view of how the real experience compared with the intended one. My research rebuilt the real flow, showed where it broke and gave the team a way to keep improving it.",
quote:"",
hctx:"A blind spot between the screens",
ctx:"This was one of several long engagements meant to grow the client’s product and design maturity over time. Esfera had a blind spot. Nobody could see the full path from searching for a reward to choosing how to pay and finishing the purchase, so nobody knew where people got stuck.",
hrole:"UX research and strategy",
role:"My role was UX research and strategy. I reconstructed the current flow of the Esfera site screen by screen, found the gaps in navigation and turned each one into a concrete improvement.",
happ:"Every path, including the awkward ones",
app:"I mapped every path a user could take, from the first search for a product or voucher to the final redemption. I included edge cases, like a payment split between points and card. The complete map became the base for specific fixes across the journey.",
hdec:"See the whole flow before touching a screen",
shots:[["santander-esfera.png","Two app screens: buying points, and paying for fuel with a slider that splits the amount between card and points","Two moments of the flow I mapped: buying points, and paying at a partner station with points, card or both.","phones"]],
dec:[["Start with the full flow, not with screens.","Redesigning screens one by one","The friction lived between screens. Only the complete map showed where users were dropping off."],
["Include the edge cases.","Mapping only the simple path","A flow that works on the simple path can still fail when a payment is split between points and card."],
["Share the reasoning with the client team.","Handing over only the recommendations","The goal was to build the client’s maturity. With the reasoning, the team could keep improving the flow on its own."]],
hout:"A clear place to start",
out:"Santander got a complete map of the redemption experience and a clear view of where it broke. The map fed a continuous cycle of product improvement with the client.",
href:"Map the flow before redesigning the screens",
ref:"The friction was rarely on a single screen. It sat in the handoffs between them, and in cases like a split payment that the simple path never shows. Mapping everything first is slower at the start, but it points the redesign at the right place."}
];
const PT={
renewal:{title:"Renovação em um clique que manteve metade das apólices",pv:"50,9% das apólices renovadas",
meta:"Única designer · 2026",
card:"Um ano depois do lançamento do seguro anual, as primeiras apólices começaram a vencer. Cada uma dependia de um corretor ocupado lembrar de renovar. Fiz a renovação caber em um clique. Metade dos motoristas ficou. Os dados mostraram onde o resto escapava.",
intro:"No Brasil, quase todo seguro de carro é vendido por corretores, consultores independentes que cuidam de dezenas de motoristas ao mesmo tempo. Quando nossas primeiras apólices anuais chegaram na hora de renovar, cada uma dependia de o corretor lembrar, cotar de novo e mandar a proposta a tempo. Se a data passasse, o motorista ficava sem seguro. Redesenhei a renovação pro corretor só precisar dizer sim.",
sc:["taxa de renovação nos primeiros meses","das propostas enviadas viraram apólice"],
quote:"A renovação não pode ser automática. Então precisava ser fácil.",
hctx:"A venda mais fácil era também a mais fácil de perder",
ctx:"Pro corretor, cliente que renova é o dinheiro mais fácil do ano. Só que as renovações chegam todas juntas, no meio de vendas novas e pedidos de suporte. E o corretor costuma começar só dez a quinze dias antes do vencimento. Por lei, toda renovação é um contrato novo, com preço novo, então nunca pode acontecer sozinha. Se o corretor se enrola, o motorista fica sem seguro.",
hrole:"A única designer, do primeiro rascunho ao treinamento do suporte",
role:"Fui a única designer do projeto. Defini o escopo com o gerente de produto, desenhei o portal do corretor, o app do cliente e as ferramentas internas, testei tudo antes do lançamento e treinei o suporte. O jurídico e o time de risco aprovaram as regras antes de eu desenhar qualquer tela.",
happ:"Os corretores já tinham me contado o que faz eles agirem",
app:"Meses antes, eu tinha entrevistado corretores. Três coisas ficaram: eles deixam a renovação pra última hora, quase sempre comparam preço de novo antes de renovar e se movem pela comissão. Então o design precisava fazer o trabalho chato por eles, mostrar o preço novo ao lado do antigo e deixar a comissão sempre à vista. Antes de abrir o Figma, resolvi um por um os casos difíceis: carro novo, desconto, renovação atrasada, troca pro plano mensal. Também usei um assistente interno de IA pra checar as regras. No dia do lançamento, peguei ele confundindo duas delas.",
hdec:"O sistema prepara, o corretor decide",
shots:[["renewal-one-click.png","Tela de renovação com o preço do ano anterior ao lado do novo, slider de comissão e os dados da apólice já preenchidos","A tela de um clique. O corretor vê o preço do ano anterior ao lado do novo, ajusta a comissão e transmite. Dados fictícios."],["renewal-list.png","Página de renovações com o status de cada apólice e os dias até o vencimento","A página de renovações, ordenada pelos dias até o vencimento. Os dados de clientes estão borrados."],["renewal-competition.png","Aviso de que outros corretores estão cotando clientes da carteira, com o card de um cliente e as vantagens do corretor: preço menor, faixa de comissão e renovação em um clique","Quando outros corretores começam a cotar clientes da carteira, o portal avisa e mostra o que o corretor ganha renovando agora. Dados fictícios.","narrow"],["renewal-commission.png","Aviso de oportunidade de comissão com renovações elegíveis, ganho atual e potencial, opções de +3%, +5% recomendado e +7% e um botão pra aplicar em todas as renovações elegíveis","A oportunidade de comissão: o portal encontra renovações com margem pra uma comissão maior, recomenda um aumento e aplica em todas de uma vez. Dados fictícios.","narrow"]],
dec:[["O sistema prepara a renovação. O corretor só decide.","Renovar sozinho, sem ninguém no meio","O preço pode mudar, então uma pessoa precisa assumir a decisão. A página de renovações mostra as apólices por ordem de vencimento. Um clique abre a nova oferta ao lado da atual, já preenchida."],
["Avisos que dão ao corretor um motivo pra agir agora.","Uma lista simples de renovações a fazer","O portal avisa quando outros corretores estão cotando um cliente dele. Também encontra renovações em que ele pode ganhar um pouco mais de comissão sem perder o melhor preço."],
["Carro ou motorista novo pede uma cotação nova.","Editar a oferta antiga","Essas mudanças mudam o risco, então o preço antigo deixa de valer. Mudanças menores, como comissão ou cobertura, só atualizam a oferta."],
["Quinze dias de tolerância depois que a apólice vence.","Pedir uma nova vistoria do carro","A gente já tinha as fotos do ano anterior. O time de risco e eu aceitamos isso de propósito, pra um corretor atrasado não perder o cliente."]],
hout:"Metade renovou e quase toda proposta enviada fechou",
out:"Nos primeiros meses, <strong>50,9%</strong> dos motoristas que podiam renovar renovaram. Das propostas que os corretores mandaram, <strong>96,5%</strong> viraram apólice. Preço, corretores e comunicação também mexem nesses números, então não credito tudo ao design.",
href:"Procurar a perda antes de polir a última etapa",
ref:"Caprichei pro último clique ser fácil. Depois, os números mostraram que quase todo mundo que chega até ali renova. A perda de verdade acontece antes, nos dias em que o corretor ainda nem olhou. Da próxima vez, eu mediria essa lacuna antes de desenhar a última tela. Essa pergunta virou o projeto seguinte: renovações que o corretor configura uma vez e o sistema manda na hora certa. Também tratei minha própria previsão com o mesmo rigor. Pesquisei 219 corretores. As respostas cortaram o ganho que eu esperava de 4,8 pra cerca de 2,3 pontos percentuais. Meu primeiro número era um teto, não uma previsão."},
assessorias:{title:"Um portal refeito em um mês, com meu primeiro código",pv:"No ar antes do fim do contrato",
meta:"Dona do produto, designer e dev · 2026",
card:"A ferramenta por trás do portal dos nossos parceiros ia ser desligada. Era nele que eles viam quanto iam receber. Redesenhei o portal e escrevi parte do código, pela primeira vez na vida. Ele entrou no ar dois dias antes do prazo.",
intro:"Muitos corretores trabalham ligados a assessorias, empresas que apoiam uma rede de corretores e ganham pelo que essa rede vende. Todo mês, as assessorias entram no nosso portal pra ver quem vendeu o quê e quanto vão receber. A ferramenta por trás desse portal estava com o contrato acabando. Se a gente não construísse um substituto, elas ficariam sem nada. Redesenhei o portal e, pela primeira vez na vida, escrevi parte do código. <strong>Ele entrou no ar dois dias antes do fim do contrato.</strong>",
sc:[],
quote:"Eu nunca tinha programado. O prazo não quis saber.",
hctx:"Prazo fixo e nada por baixo",
ctx:"As assessorias trazem uma parte importante das nossas vendas. O portal mostra quanto elas faturam pra gente todo mês. Se ele saísse do ar, elas ficariam no escuro sobre o próprio negócio. O CTO preferiu construir um substituto de verdade a fazer uma cópia rápida. O problema: o portal antigo lia direto do nosso banco de dados, então nenhuma das conexões que o novo precisava existia.",
hrole:"Designer, dona do produto e, pela primeira vez, dev",
role:"Mapeei o portal antigo, desenhei o novo e escrevi código de produção pra várias telas, inclusive a que as assessorias usam pra ver quanto vão receber. Um gerente de produto me acompanhou nas primeiras semanas com um assistente de IA pra programar e escreveu cerca de metade do front-end. Os engenheiros revisaram e aprovaram tudo que escrevi antes de ir pro ar.",
happ:"Ligar cada tela ao dado por trás dela",
app:"Antes de desenhar qualquer coisa, percorri o portal em produção e documentei as 11 telas, cada filtro, coluna e botão. Depois montei um protótipo navegável. Quando a engenharia avisou que os dados por trás das telas ainda não existiam, reorganizei o plano pra começar pelo backend. Cada rodada de design saiu com um mapa mostrando de onde viria cada número da tela.",
hdec:"Refazer o que existe e nada além",
shots:[["assessorias-home.png","Home do portal das assessorias com seis cards do funil de corretores: cadastrados, que acessaram, que cotaram, sem cotação, que venderam e total de apólices","A home mostra à assessoria o funil dos corretores de relance: cadastrados, que acessaram, que cotaram, que venderam. Os dados reais estão escondidos."],["assessorias-production.png","Tela de Produção com um mês fechado selecionado, cards de bilhetes, comissão e prêmio líquido e a tabela de apólices","A tela de Produção, a que importa pro dinheiro. Um mês fechado fica congelado e mostra o valor pra nota fiscal. Os dados reais estão escondidos."]],
dec:[["Só o que o portal antigo já fazia.","Aproveitar pra lançar coisa nova","Com prazo fixo, o dia do lançamento só precisava igualar o portal antigo. Todo pedido novo foi pra uma lista de depois."],
["Um portal separado pras assessorias.","Um portal só pra assessorias e corretores","Assessorias e corretores entram de jeitos diferentes. Juntar os dois significaria manter dois sistemas de login no mesmo produto."],
["A visão do time interno foi pras ferramentas internas.","Um portal atendendo dois públicos","Nosso time de operação precisava de outro menu, com outras telas. Tirar essa visão também tirou uma decisão que a gente não precisava tomar."]],
hout:"No ar dois dias antes do prazo",
out:"As assessorias contaram aos gerentes de conta o que estava faltando. Corrigi a maior parte no código no mesmo dia. A ferramenta antiga foi desligada no dia seguinte. Da minha primeira linha de código até a produção, foi <strong>menos de um mês</strong>.",
href:"O que o dia do lançamento me ensinou",
ref:"No dia do lançamento, uma tela deixou alguns corretores de fora. A tela nova buscava os dados de um jeito que a antiga nunca tinha buscado. Ali aprendi que mudar uma tela de lugar também é mudar de onde vem o dado dela. Hoje, antes de qualquer publicação, confiro cada mudança que vai junto e paro se alguma não for minha."},
assist:{title:"Um guincho que o cliente vê chegando",pv:"Rastreamento ao vivo no app",
meta:"Product designer · 2024",
card:"A assistência 24h era o serviço que nossos clientes mais usavam. A que a gente tinha deixava a pessoa esperando sem notícia. Com uma nova rede de guinchos sob demanda, redesenhei o app pra quem está parado na estrada pedir ajuda e ver o guincho chegar.",
intro:"A assistência 24h era o serviço que nossos clientes mais usavam e o mais urgente. A que a gente tinha dependia de fila no telefone e não dava nenhum sinal de quando a ajuda ia chegar. Quando a empresa trocou pra uma rede de guinchos sob demanda, redesenhei a experiência de assistência no app, do pedido até ver o guincho chegando. Foi meu primeiro projeto na empresa.",
sc:["dos clientes usavam assistência por mês, contra 1,8% que abriram sinistro","dos pedidos passavam pelo telefone, sem a gente ver o que era enviado"],
quote:"Quem está parado na estrada tem uma pergunta só: quando a ajuda chega?",
hctx:"Esperando na estrada sem notícia",
ctx:"O cliente esperava muito só pra ser atendido no telefone. Depois, muitos não sabiam se a ajuda chegaria em 30 minutos ou em 3 horas. Eles se sentiam abandonados. Com o fornecedor antigo, os 5% de pedidos mais lentos esperavam cerca de 15 horas. A maioria dos pedidos passava pelo telefone, então a gente não controlava qual solução era enviada. A empresa decidiu trocar pra uma rede de guinchos sob demanda, uma espécie de Uber dos guinchos. A meta era 95% dos atendimentos chegarem em até 150 minutos.",
hrole:"Product designer, em dupla com o PM de operações",
role:"Fui a product designer da experiência no app, em dupla com o gerente de produto de operações. Conduzi a discovery com o feedback dos clientes, defini os critérios de design, desenhei os fluxos de pedido e acompanhamento e planejei como validar.",
happ:"O que quem está parado na estrada realmente pede",
app:"Analisei três meses de feedback de assistência, notas e comentários. O cliente pedia quatro coisas: ajuda em uma ou duas horas, pedir e acompanhar pelo app sem ligar pra ninguém, respostas rápidas e clareza sobre custos extras como táxi, hotel ou peças. Também olhei como outras seguradoras resolviam isso. Uma mostrava quantos usos de cada serviço ainda restavam. Outra mostrava uma linha do tempo ao vivo de cada evento. Outra fazia algumas perguntas pra priorizar os casos urgentes. O relato de uma cliente sobre se sentir vulnerável e insegura enquanto esperava fez do rastreamento um requisito.",
hdec:"Devolver ao cliente a sensação de controle",
shots:[["assist-tracking.png","Três telas do app com a previsão de chegada, o mapa com o guincho e os dados do prestador","Rastreamento ao vivo no app: previsão de chegada, dados do prestador e um mapa que atualiza conforme a ajuda se move. Dados fictícios.","phones"]],
dec:[["Três critérios inegociáveis: fácil de pedir, sempre visível, sem surpresa no custo.","Polir tela por tela","Toda escolha de design passava pelas mesmas três perguntas. Consigo pedir ajuda sem ligar? Sei onde a ajuda está agora? Sei o que está coberto e o que posso pagar?"],
["Um pedido aberto toma conta da tela inicial.","Deixar o acompanhamento dentro do menu de assistência","Quem está parado na estrada abre o app pra saber uma coisa só. A tela inicial mostra a previsão de chegada, os dados do prestador e a localização ao vivo até a ajuda chegar."],
["Lançar em fases, com feature flags.","Trocar todos os tipos de assistência de uma vez","A primeira fase cobriu pedidos de bateria e guincho pelo app, com um link de rastreamento por SMS e acesso limitado por região e por parte da base. O rastreamento ao vivo no app e os outros serviços vieram depois."],
["Mostrar limites de uso e possíveis custos extras logo de cara.","Explicar o custo só depois do serviço","O cliente pedia clareza sobre o que está coberto. Uma cobrança surpresa no pior momento do dia desfaz tudo que o fluxo acerta."]],
hout:"Ajuda que dá pra ver chegando",
out:"O novo fornecedor assumiu a assistência 24h. O cliente passou a acompanhar o guincho ao vivo no app, da previsão de chegada ao nome do prestador. Antes da troca, a prova de conceito tinha estimado uma economia de cerca de 17% nos custos de assistência.",
href:"Desenhar pro pior momento do dia de alguém",
ref:"Foi meu primeiro projeto na empresa e foi onde aprendi o produto por dentro: assistência, operação e o que o cliente sente no pior momento do dia. Num fluxo urgente, o mais útil que uma interface pode dar é a certeza do que vem a seguir."},
account:{title:"Do código esquecido a um desconto que o corretor usa",pv:"57% dos corretores aplicaram desconto",
meta:"Dona do produto e designer · 2026",
card:"O corretor perde venda por preço todo dia. A gente tinha um jeito de deixar ele dar desconto, mas isso só existia no código. Transformei num saldo que o corretor vê e gasta. No caminho, mudei de ideia sobre onde ele gasta.",
intro:"Imagine um corretor prestes a perder o cliente por causa do preço. Os corretores que vendem bem com a gente ganham um saldo mensal, em reais, pra dar desconto. As regras já existiam, mas nenhum corretor conseguia ver nem usar esse dinheiro. Desenhei as telas e as regras que colocaram esse saldo na mão deles.",
sc:["dos corretores elegíveis que cotaram aplicaram desconto, contra 49% antes","dos corretores com saldo nunca usaram, contra 60% antes"],
quote:"",
hctx:"Um desconto que ninguém conseguia usar",
ctx:"Preço é uma das objeções que o corretor mais ouve. A aposta da empresa era que um desconto na mão dele fecharia mais vendas. Só que o motor de descontos existia só como regra de negócio e um código que nada chamava. O corretor ganhava um dinheiro que não conseguia ver, muito menos gastar.",
hrole:"Decidi e respondi pelas decisões",
role:"Fui a dona da definição do produto. Tomei as decisões de produto, design, texto e escopo e respondi por elas aos líderes de receita, comercial e engenharia. Trabalhei com o CTO e com um dos sócios no motor de preços e com os engenheiros na construção.",
happ:"O modelo mudou no meio do caminho",
app:"Comecei lendo os documentos e o código do motor pra entender o que já existia. Desenhei uma primeira versão. Aí o modelo mudou de créditos fixos pra um saldo em reais. Reescrevi a definição inteira em um dia. Com o comercial e a receita, batizei de ‘conta corrente’, um nome que o corretor já usa pra dinheiro que ele pode sacar. Depois montei um protótipo navegável pros dois líderes donos das regras. O primeiro beta saiu com o motor desligado e nenhum corretor viu o desconto. Tiramos do ar e relançamos.",
hdec:"Mostrar o limite e nunca travar a venda",
shots:[["account-quote-discount.png","Etapa de últimos detalhes da cotação com o slider pra aplicar o desconto da conta corrente, o desconto máximo, a economia do cliente e o resumo de valores","O desconto na cotação: um slider limitado ao teto do corretor, com o motivo escrito logo abaixo e o resumo atualizando conforme ele se move. Dados fictícios."],["account-balance.png","Menu Financeiro na aba Conta Corrente: saldo do mês com valores usados e disponíveis, um card de como usar e a tabela do histórico de descontos e devoluções","A conta corrente no menu Financeiro: o saldo do mês, como usar e cada desconto e devolução no histórico. Dados fictícios, com nomes de clientes borrados."],["account-simulator.png","Barra do simulador de comissão de 10% a 30% com a comissão do corretor, o desconto que o cliente pode ter e o espaço até o teto","O simulador de comissão: o corretor arrasta a divisória e vê quanto espaço sobra pra desconto, até o teto."]],
dec:[["Um slider que mostra o teto e o motivo dele.","Um campo de desconto sem explicação","O corretor que lê ‘Seu teto é 8% porque comissão mais desconto não passa de 20%’ entende que o limite é algo que ele controla."],
["Reservar o saldo só quando a proposta é enviada.","Reservar enquanto o corretor ainda está cotando","Cotações que nunca viravam venda prendiam dinheiro. Levar a reserva pra proposta liberou tudo."],
["Desconto já na cotação, depois de dizer não duas vezes.","Desconto só no fim","No começo deixei o desconto pro fim, porque o saldo é compartilhado e o PDF da cotação é uma promessa pro cliente. As reclamações não pararam. Então desenhei a versão na cotação em três dias, com uma prévia que não reserva nada."],
["O saldo é da corretora e o time todo usa.","Um saldo por login","A primeira versão prendia o saldo a cada login. Corretoras com equipe acabavam dividindo o saldo sem querer."],
["O motor nunca trava uma venda.","Parar a cotação quando o motor falha","Um problema no desconto nunca pode impedir o corretor de vender."]],
hout:"Mais corretores usam. Poucas cotações levam.",
out:"No primeiro mês cheio, <strong>57%</strong> dos corretores elegíveis que cotaram usaram desconto, contra 49% antes. Os que nunca mexeram no saldo caíram de 60% pra 51%. Ainda assim, só 0,9% das cotações levam desconto. O número que vai decidir a aposta é se a cotação com desconto fecha mais.",
href:"Mudar de ideia com dado",
ref:"Disse não duas vezes, sempre com argumento. Quando o volume de reclamações provou o ponto, redesenhei em três dias. Mudei de ideia porque a evidência mudou. Uma pergunta continua aberta: corretores que já estão com 20% de comissão não conseguem usar o desconto. Isso é decisão de preço, então levantei a questão e deixei com quem define preço."},
annual:{title:"A apólice anual que chegou a 89% das vendas novas",pv:"89% das vendas novas são anuais",
meta:"Product designer · 2025",
card:"A gente só vendia um plano mensal, que o motorista podia largar a qualquer mês. Desenhei o lançamento de uma apólice de 12 meses, inclusive daquele momento estranho em que o cliente já pagou, mas a apólice ainda não é definitiva. Dezesseis meses depois, ela era 89% das vendas novas.",
intro:"No começo, a gente vendia seguro de carro como assinatura: mensal, fácil de cancelar e fácil de perder. A apólice anual mudou isso. Ela deu ao corretor um cliente pra manter e algo pra renovar. Só que pedia mais do motorista antes de começar: pagar primeiro, talvez agendar uma vistoria ou instalar um rastreador e depois dirigir 80 km com o nosso app ligado. Desenhei esse lançamento no portal do corretor, no app do cliente e nas ferramentas internas.",
sc:["das vendas novas no lançamento","das vendas novas 16 meses depois"],
quote:"Proposta paga ainda não é apólice.",
hctx:"Um produto melhor com um começo mais difícil",
ctx:"Até cada etapa ficar pronta, o cliente tinha cobertura provisória. O corretor precisava explicar, o suporte precisava responder e o cliente precisava confiar. Quem não entendesse esse meio do caminho podia se sentir desprotegido logo depois de pagar. Era exatamente o medo dos gerentes de corretores.",
hrole:"Três produtos e as pessoas por trás deles",
role:"Desenhei o portal do corretor, o app do cliente e as ferramentas internas com o gerente de produto de seguros. Escrevi o plano de testes e treinei os gerentes de corretores e o suporte. Preparei o lançamento com os engenheiros que construíram cada parte.",
happ:"Ouvi quem ia ter que explicar o produto",
app:"Duas semanas antes do lançamento, treinei os gerentes de corretores e transformei cada preocupação deles numa ação. O cliente vindo de outra seguradora ia manter o desconto por não ter batido o carro? Alguém ia ficar sem cobertura esperando a vistoria? O cliente ia instalar o app rápido o bastante? Uma semana antes, revisei os testes com o gerente de produto, um produto por vez. Anotei por que cada correção importava.",
hdec:"Uma ideia só pra todo mundo aprender",
dec:[["Etapas de uma proposta, não novos tipos de cobertura.","Um nome de cobertura diferente pra cada etapa pendente","Cobertura provisória, vistoria pendente, rastreador pendente e teste de direção pendente são etapas da mesma proposta. Corretor, suporte e cliente só precisavam aprender uma ideia."],
["O tipo de apólice visível em todo lugar.","Mostrar mensal e anual do mesmo jeito","O suporte precisava diferenciar os dois produtos de relance. Nos testes, pedi uma coluna de tipo de apólice e o status do rastreador na tabela de propostas."],
["Carro zero sem placa vai pra uma pessoa.","Bloquear a cotação","É raro e a operação resolve na mão. Não quis travar uma venda legítima."]],
hout:"De 15% a 89% das vendas novas",
out:"Lançamos pra um grupo pequeno de corretores e abrimos pra todos uma semana depois. O anual foi de 15% das vendas novas no lançamento pra <strong>89%</strong> dezesseis meses depois. Preço e incentivos aos corretores também puxaram esse número, então não credito tudo ao design.",
href:"Acertar as palavras antes das telas",
ref:"Defini o vocabulário cedo. O produto mensal é um bilhete. O anual é sempre uma apólice. Quando dois produtos convivem, usar as mesmas palavras em todo lugar evita mais confusão do que qualquer tela."},
onboarding:{title:"640 conversas que mostraram onde o corretor novo trava",pv:"1 em cada 5 corretores nunca responde",
meta:"Co-dona da pesquisa · 2026",
card:"Corretores novos se cadastram, são aprovados e depois somem. Pra entender por quê, li 640 conversas reais em vez de uma amostra. A mensagem de ‘boas-vindas’ que eles recebiam era, na verdade, um pedido pra marcar uma ligação.",
intro:"Um corretor novo se cadastra, é aprovado e está pronto pra vender. Aí, muitas vezes, nada acontece. Ninguém sabia por quê. Co-liderei uma pesquisa que leu 640 conversas reais de WhatsApp entre corretores novos e quem faz o acolhimento deles. Mapeamos o que acontece semana a semana. Isso virou a base de um agente de IA que vai receber os corretores novos.",
sc:["das primeiras mensagens pedem pra marcar uma ligação","dos corretores novos nunca respondem"],
quote:"Eu ouvi conversas, não pessoas.",
hctx:"Os corretores se cadastravam e depois sumiam",
ctx:"A empresa queria mais corretores que vendem de verdade. O acolhimento era manual. Um gerente de conta remoto conseguia cuidar bem de cerca de metade dos corretores novos de cada mês. O primeiro contato vinha 6,5 dias depois da aprovação, enquanto o guia interno prometia um dia. A pergunta do trimestre era simples: onde o corretor novo trava?",
hrole:"Co-dona da pesquisa",
role:"Fui co-dona do projeto com o gerente de produto. Mapeei a jornada, montei o blueprint de serviço, li conversas e conferi os bastidores com quem opera cada etapa. Cinco colegas me ajudaram a ler tudo.",
happ:"Do processo oficial às conversas de verdade",
app:"Comecei pelo processo documentado e mapeei como o acolhimento deveria funcionar. Depois, cinco leitores passaram por 640 conversas de WhatsApp do começo ao fim. Transcrevi 149 áudios no meu próprio computador, pra nenhum dado pessoal sair dele. Por fim, conferi cada etapa dos bastidores com os times envolvidos e comparei o guia com o que de fato acontecia.",
hdec:"Ler tudo antes de propor qualquer coisa",
shots:[["onboarding-blueprint.png","Blueprint de serviço com seis etapas em raias de ações do corretor, pontos de contato, frente, bastidor, sistemas e dores, mais um gráfico que compara o tempo do playbook com o observado em cada etapa","O blueprint de serviço: seis etapas em nove raias, do que o corretor faz ao que acontece nos bastidores, com o playbook e a realidade lado a lado. Nomes do time e ferramentas internas estão borrados."]],
dec:[["Ler tudo, não uma amostra.","Buscar as conversas por palavra-chave","Palavra-chave só acha o que você já espera. Ler tudo mostrou que a boas-vindas era, na verdade, um pedido de ligação. Nenhuma palavra-chave acharia isso."],
["Quando dois times discordam, vale quem faz o trabalho.","Dar o mesmo peso a todas as fontes","Dois times descreveram o cadastro de jeitos diferentes. Fiquei com a versão de quem aprova os cadastros no dia a dia."],
["Mapear a jornada e deixar as soluções pra depois.","Propor uma correção pra cada dor","Essa fase era pra entender. As soluções ficam pro próximo projeto."]],
hout:"Quatro achados que o guia não previa",
out:"O blueprint cobre seis etapas, do primeiro contato à carteira ativa, com o guia oficial e a realidade lado a lado. <strong>75%</strong> das mensagens de boas-vindas pedem pra marcar uma ligação. <strong>20%</strong> dos corretores novos nunca respondem. Configurar a ferramenta que compara seguradoras leva de 14 a 30 dias sem ajuda, contra 2 no guia. E a aprovação, que preocupava todo mundo, quase nunca aparece como reclamação. A dor de verdade é o app e a nota de direção que os clientes deles enfrentam.",
href:"O que esta pesquisa não consegue me dizer",
ref:"Esta pesquisa mostra o que o corretor pergunta, mas não por quê nem como ele se sente. Faltam entrevistas com corretores recém-aprovados. Eu faria essas entrevistas antes de qualquer redesenho."},
itau:{title:"Ajudar o Itaú a prevenir a dívida em vez de cobrar",pv:"4 perfis de crédito, uma estratégia preventiva",
meta:"Pesquisa de UX e estratégia · Consultoria de service design · 2022",
card:"A área de recuperação do Itaú queria agir antes de o cliente cair numa dívida longa. Minha pesquisa encontrou quatro jeitos de lidar com crédito. Ela ajudou a transformar ‘preventivo’ de uma meta vaga em diretrizes pra cada etapa do ciclo de crédito.",
intro:"Dívida no Brasil é um problema de massa. No fim de 2025, o Serasa contava cerca de 81 milhões de pessoas inadimplentes, quase metade dos adultos. No Itaú, cerca de 30% dos clientes tinham alguma dívida. A área de recuperação queria agir antes, enquanto o atraso ainda era curto. Trabalhei com pesquisa de UX e estratégia pra definir o que ‘preventivo’ deveria significar pro banco. E pra quem.",
sc:[],
quote:"O sucesso é o cliente não precisar de recuperação.",
hctx:"Uma área de recuperação que queria recuperar menos",
ctx:"A área era cobrada por regularização, participação do digital e custo. Um stakeholder resumiu: o time era medido principalmente pelo share do digital. Só que o digital ainda não era onde a maioria dos clientes negociava. Na concorrência, era. O banco não tinha uma estratégia clara pro preventivo. Pra cada pessoa, a palavra significava uma coisa: um SMS antes do vencimento, educação financeira, um produto novo. Sem definição, toda área podia reivindicar o preventivo e nenhuma conseguia agir.",
hrole:"Pesquisa de UX e estratégia",
role:"Meu papel foi pesquisa de UX e estratégia, num time de consultoria que trabalhou com a área de recuperação do Itaú. Trabalhei no benchmark, entrevistei clientes em dupla com o time e ajudei a sintetizar o que ouvimos em perfis, numa jornada e nas diretrizes finais.",
happ:"Stakeholders, benchmark e depois os clientes",
app:"Começamos com entrevistas com stakeholders pra levantar o que a área queria aprender. Uma das perguntas: o que faria um cliente com os últimos R$ 1.000 renegociar com o Itaú e não com um concorrente? Em paralelo, ajudei a consolidar um benchmark. Depois entrevistamos correntistas e não correntistas com dívida de cartão, empréstimo pessoal ou cheque especial de até 30 dias de atraso. Uma hipótese guiou o roteiro: lidar com a dívida tem um custo emocional alto. Por isso renegociar precisa exigir o mínimo de esforço mental e emocional. As entrevistas revelaram quatro jeitos de lidar com crédito, em dois eixos: o quanto a pessoa planeja as finanças e o quanto ela resiste a mudar hábitos.",
prof:[["O otimista","“Eu já vou ter que pagar aluguel mesmo. Pago no cartão e ainda ganho milhas.”","Menos planejado · resiste a mudanças"],["O planejador","“Dinheiro na mão é poder de negociação.”","Mais planejado · resiste a mudanças"],["O flexível","“Não dá pra fazer tudo, tem que priorizar.”","Menos planejado · aberto a mudanças"],["O racional","“Banco, tenho preconceito. Sei que vou ser tratado só como mais um. Por isso opto por fintechs.”","Mais planejado · aberto a mudanças"]],
hdec:"Definir o preventivo antes de desenhar pra ele",
shots:[["itau-workshop.png","Quadro de workshop com três marcos rotulados como inovação incremental, disruptiva e radical","Um quadro do workshop de priorização com o cliente: opções separadas em três marcos, da inovação incremental à radical. Nomes e anotações estão borrados."]],
dec:[["O preventivo é uma cultura em todo o ciclo de crédito, com ações diferentes pra cada fase e perfil.","Tratar o preventivo como uma ação só, tipo um SMS de lembrete, ou só como educação financeira","Um ponto de contato sozinho não segura ninguém fora da dívida. Escrever o que o preventivo é e o que não é deu a todas as áreas o mesmo alvo."],
["Começar pelos quatro perfis de crédito.","Começar pelos canais ou pelos produtos","As pessoas reagem de jeitos diferentes ao mesmo estímulo. Os perfis mostraram qual ação serve pra quem, da tomada de crédito aos primeiros dias de atraso."],
["Diretrizes de service design como entrega final.","Um protótipo conceito de produto, ou um workshop de facilitação","Levamos três caminhos pro cliente e votamos juntos no que mais importava pra área. O buraco estava entre a estratégia e o dia a dia. O time precisava de diretrizes que conseguisse aplicar em cada canal."],
["Aprofundar em um momento e um perfil.","Cobrir todas as fases e perfis na mesma profundidade","As diretrizes focaram nos primeiros 30 dias de atraso, enquanto a dívida ainda é curta, pra um perfil. Um recorte fundo e usável valia mais que um mapa raso de tudo."]],
hout:"De palavra da moda a diretrizes que a área consegue usar",
out:"A entrega final transformou o preventivo numa definição de trabalho, numa jornada dos quatro perfis pelo ciclo de crédito e em diretrizes de comunicação pros primeiros 30 dias de atraso. Pra cada momento, as diretrizes cobriam o que o cliente espera ouvir, como o Itaú deve se comportar, quais canais usar e o que dispara cada mensagem. Elas partiam das perguntas que o cliente faz nessa janela, como ‘como posso confiar que o banco está me ajudando a tomar a melhor decisão pra mim?’. Antes disso, a área já tinha recebido um diagnóstico, um mapa de emoções e a jornada do ciclo de crédito.",
href:"Nomear a coisa antes de desenhar",
ref:"A pesquisa foi a parte fácil. A difícil foi fazer uma área inteira concordar sobre o que uma palavra significava. Escrever o que o preventivo é e o que não é alinhou mais gente do que qualquer tela teria alinhado."},
nestle:{title:"Um ecossistema só pros sites das marcas da Nestlé Brasil",pv:"Sites das marcas unificados numa plataforma",
meta:"Pesquisa de UX e estratégia · Consultoria de estratégia de produto na Thoughtworks",
card:"A Nestlé Brasil mantinha os sites e produtos digitais das marcas com estratégias separadas. Trabalhei na pesquisa e na estratégia pra unificar tudo e fui dona do roadmap de cinco anos. Depois, o programa unificou os sites de campanha das marcas numa plataforma só.",
intro:"A Nestlé Brasil mantinha marcas, plataformas e produtos digitais com estratégias separadas. O consumidor encontrava uma experiência diferente em cada site. O dado era difícil de coletar e de conectar. Trabalhei com pesquisa de UX e estratégia num ecossistema único e fui dona do roadmap de cinco anos.",
sc:[],
quote:"",
hctx:"Tráfego que nunca virava dado",
ctx:"Cada marca tinha os próprios sites de campanha e produtos digitais. Sites com propósitos parecidos seguiam estratégias separadas, então a experiência mudava de um pro outro. A maior parte das visitas nunca virava dado útil. Ao mesmo tempo, a Nestlé tinha assumido em público o compromisso de construir dados próprios em escala. Em 2021, ela se propôs a dobrar sua base de dados de consumidores em quatro anos, bem quando os cookies de terceiros estavam saindo de cena.",
hrole:"Pesquisa de UX e estratégia",
role:"Meu papel foi pesquisa de UX e estratégia. Refinei a visão do produto e dei forma a um objetivo estratégico único pro ecossistema. Mapeei o negócio, os usuários e o mercado, incluindo oportunidades que os concorrentes ainda não tinham aproveitado. Fui dona do roadmap de cinco anos.",
happ:"Sete áreas e todas as regiões do Brasil",
app:"Entrevistei stakeholders de sete áreas e clientes de todas as regiões do Brasil. O time também fez um workshop com seis áreas. Partimos de cinco hubs, cada um com seu site, com públicos e esforços que se sobrepunham. A pesquisa precisava responder a uma pergunta: quais hubs ficam e quais saem. Depois esboçamos o ecossistema ideal, montamos wireframes, escolhemos as funcionalidades por votação e definimos como cada produto alimenta o data lake da marca.",
hdec:"Um hub fora, três unidos, um mantido",
dec:[["Um hub fora, três unidos, um mantido.","Manter os cinco hubs, cada um com seu site","A pesquisa mostrou que um hub não era prioridade. As pessoas viam valor parecido nos três hubs promocionais (promoção, clube e Eu Quero Nestlé), então unimos os três num só. Receitas ficou como estava: o valor era claro e ele já trazia gente."],
["O consumidor no centro, num núcleo logado.","Deixar cada hub com o próprio cadastro","Uma área logada única concentra o cadastro e o relacionamento. Ela mantém as pessoas no ecossistema e dá a todos os hubs a mesma visão do consumidor."],
["Um limite com regras pra entrar.","Deixar qualquer hub novo entrar","Um hub novo vai pra onde a estratégia dele se encaixa: benefício, conteúdo e comunidade ou dado. Critérios decidem se um hub fica, fecha ou nasce."],
["Enriquecimento de dado em cada troca.","Tratar o data lake só como armazenamento","O data lake envolve tudo e cada troca entre os hubs acrescenta dado de comportamento e consumo. Esse enriquecimento é o que faz o ecossistema funcionar."]],
hout:"De uma visão a plataformas no ar",
out:"Stakeholders de sete áreas se alinharam em uma visão de produto. A validação com usuários pediu só pequenos ajustes. O desenho do ecossistema saiu de hubs espalhados lado a lado pra um alvo, com o consumidor no centro. Em 2026, a Nestlé Brasil e a Thoughtworks anunciaram os resultados do programa: os sites de campanha das marcas unificados na plataforma Eu Quero Nestlé Promoções, um hub de saúde chamado Nutrição Até Você e uma estratégia de design com o roadmap completo de produto. A Nestlé também passou a gerir o ecossistema digital com pensamento de produto, como algo que evolui sempre.",
href:"Unificar o dado antes das telas",
ref:"O problema visível era ter sites demais. O real era que cada site coletava dado do seu jeito. Enquadrar o trabalho em torno de um fluxo de dados só deu a todas as áreas o mesmo motivo pra apoiar uma plataforma única."},
santander:{title:"Onde quebra o resgate de pontos do Santander Esfera",pv:"Todos os caminhos mapeados",
meta:"Pesquisa de UX e estratégia · Consultoria de UX",
card:"Ninguém no Santander Esfera conseguia ver o caminho completo entre achar uma recompensa e pagar por ela. Reconstruí esse caminho tela por tela, com os casos de borda. Depois mostrei onde ele quebrava.",
intro:"O Esfera é o programa de fidelidade do Santander. Quem tem o cartão compra pontos, navega num catálogo e resgata por produtos e vouchers, ou usa os pontos em parceiros. O negócio não conseguia ver como a experiência real se comparava com a planejada. Minha pesquisa reconstruiu o fluxo real, mostrou onde ele quebrava e deu ao time um jeito de continuar melhorando.",
sc:[],
quote:"",
hctx:"Um ponto cego entre as telas",
ctx:"Este foi um de vários trabalhos longos pra aumentar a maturidade de produto e design do cliente ao longo do tempo. O Esfera tinha um ponto cego. Ninguém conseguia ver o caminho completo entre buscar uma recompensa, escolher como pagar e concluir a compra. Então ninguém sabia onde as pessoas travavam.",
hrole:"Pesquisa de UX e estratégia",
role:"Meu papel foi pesquisa de UX e estratégia. Reconstruí o fluxo atual do site do Esfera tela por tela, achei as lacunas de navegação e transformei cada uma em uma melhoria concreta.",
happ:"Todos os caminhos, inclusive os estranhos",
app:"Mapeei todos os caminhos possíveis, da primeira busca por um produto ou voucher até o resgate final. Incluí os casos de borda, como um pagamento dividido entre pontos e cartão. O mapa completo virou a base de correções específicas ao longo da jornada.",
hdec:"Ver o fluxo inteiro antes de mexer numa tela",
shots:[["santander-esfera.png","Duas telas do app: a compra de pontos e o pagamento de combustível com um slider que divide o valor entre cartão e pontos","Dois momentos do fluxo que mapeei: a compra de pontos e o pagamento num posto parceiro com pontos, cartão ou os dois.","phones"]],
dec:[["Começar pelo fluxo inteiro, não pelas telas.","Redesenhar tela por tela","O atrito morava entre as telas. Só o mapa completo mostrou onde os usuários desistiam."],
["Incluir os casos de borda.","Mapear só o caminho simples","Um fluxo que funciona no caminho simples ainda pode falhar quando o pagamento é dividido entre pontos e cartão."],
["Compartilhar o raciocínio com o time do cliente.","Entregar só as recomendações","O objetivo era aumentar a maturidade do cliente. Com o raciocínio, o time conseguia continuar melhorando o fluxo sozinho."]],
hout:"Um lugar claro pra começar",
out:"O Santander ganhou um mapa completo da experiência de resgate e uma visão clara de onde ela quebrava. O mapa alimentou um ciclo contínuo de melhoria do produto com o cliente.",
href:"Mapear o fluxo antes de redesenhar as telas",
ref:"O atrito raramente estava numa tela só. Ele aparecia na passagem entre elas e em casos como o pagamento dividido, que o caminho simples nunca mostra. Mapear tudo antes demora mais no começo. Em troca, aponta o redesenho pro lugar certo."}
};

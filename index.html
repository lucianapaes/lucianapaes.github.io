en:{kicker:"Lu Moraes · Senior product designer · São Paulo",
h1:"Product design grounded in research, strategy, and the <span class=\"hl\">realities of building</span>.",
sub:"I work across discovery and delivery in fast-moving insurtech and fintech. I build next to engineers, in working code, so we get from a question to a decision we can trust.",
sh1:"Featured work",sh2:"More work",sh3:"Background",bgl:"From design consulting to building with engineers.",
flow:[["Discovery","Interviews, shadowing and reading real conversations."],["Strategy","Trade-offs, metrics and getting different areas on the same page."],["Design and build","Flows, states and copy, prototyped in code next to engineers."]],
more:"Read my full background",cta1:"Have a hard product problem?",cta2:"I’m open to senior product design roles, advisory and early-stage product work.",
ak:"Profile · São Paulo · Brazil",ah:"About",
asum:"Senior product designer. I move between research, strategy and production code, usually in high-stakes places like insurance.",
ap:["I started in strategic design consulting, studying how people behave, how services work and how big organizations fit together. Today I’m a product designer. I do UX and UI work side by side with product teams, from a fuzzy problem all the way to something real in production.","I like to understand a problem before I make it pretty. That means spending time in regulations, business operations and the way things are built. In high-stakes areas like underwriting or partner platforms, a team has to explain its decisions, test them and defend them. I want mine to hold up.","Design and code don’t need a wall between them. Instead of handing over a static prototype and hoping it survives, I work inside the stack. With Claude Code, Git, Docker and VS Code I test state machines and real data models, so the time between an idea and a customer gets shorter.","I also bring mentoring experience. I’ve coached junior product managers on how to prioritize, structure their work and step back when things get messy.","English is my working language. I collaborate with colleagues from Africa, Europe and North and South America."],
born:"I was born in Belém, in the Brazilian Amazon.",
prh:"Principles & working model",
pr:[["Understand the problem before making it pretty.","Before I open Figma, I read the regulation, sit with operations and look at how the system is built. You’ll see rough work from me a bit later. In exchange, we agree on the problem before we argue about a screen."],["Design with the people who run it.","Before I call a flow done, I sit with the people who will run it: support, operations, underwriting. They know where it breaks. It means more conversations up front, and fewer problems after launch."],["Check before I speak.","Before I answer, I look at the code and the data. If I didn’t check something, I say so. I’d rather answer an hour later than answer wrong."],["Prototype the way it will ship.","I build with engineers, in code, so the weird edge cases show up while they’re still cheap. It takes longer than a static screen. But nobody gets surprised at handoff."]],
exh:"Experience & domains",
ex:[["Insurtech and broker networks","Product design for brokers, advisory firms and internal tools, from discovery to delivery. I turn underwriting rules into flows brokers can sell and customers can follow."],["Strategy and service consulting","Ecosystems, customer journeys and qualitative research for Nestlé, Itaú and Santander."],["Regulated, rule-heavy systems","In insurance, regulation, underwriting limits and tax changes decide what an interface can say. I design inside them."]],
sph:"Practice & capabilities",
sp:[["UX research and discovery","Interviews, shadowing, reading real conversations, journey maps, service blueprints, jobs to be done and surveys. I organize what I learn before I open a layout."],["Product strategy","PRDs, priorities, trade-offs, roadmaps and success metrics, each with a clear definition."],["Product design","UX and UI for web and mobile: flows, states and edge cases, plus copy, prototypes, handoff and design QA."],["Build with engineers","Claude Code, Git, Docker, React and HTML/CSS, plus warehouse queries to test decisions. Engineers review what I write."]],

hp:[["…nobody agrees on what the problem is.","I talk to the people, read the rules and come back with one definition everyone signs, plus a roadmap and the test cases."],["…a decision needs evidence to stand on.","I connect research to the choice on the table and write down the trade-offs, so the priority is easy to defend."],["…the design has to survive engineering.","I prototype in code next to engineers. I’ve shipped production code they reviewed, so handoff brings no surprises."],["…the rules are strict and the flow still has to feel good.","Legal, underwriting, regulation. I design flows that pass review and that people still enjoy using."]],

more:"Leia minha trajetória completa",cta1:"Tem um problema de produto difícil?",cta2:"Estou aberta a vagas sênior de product design, consultorias e produtos em fase inicial.",
ak:"Perfil · São Paulo · Brasil",ah:"Sobre",
asum:"Product designer sênior. Circulo entre pesquisa, estratégia e código em produção, quase sempre em áreas de alto risco, como seguros.",
ap:["Comecei em consultoria estratégica de design, estudando como as pessoas se comportam, como os serviços funcionam e como as grandes empresas se organizam. Hoje sou product designer. Faço UX e UI junto com times de produto, de um problema ainda nebuloso até algo de verdade no ar.","Gosto de entender o problema antes de deixar bonito. Por isso passo tempo na regulação, na operação e em como as coisas são construídas. Em áreas de alto risco, como aceitação de seguros ou plataformas de parceiros, o time precisa explicar, testar e defender cada decisão. Quero que as minhas se sustentem.","Design e código não precisam de um muro no meio. Em vez de entregar um protótipo estático e torcer pra ele sobreviver, trabalho dentro do código. Com Claude Code, Git, Docker e VS Code, testo estados e dados reais. Assim, uma ideia chega mais rápido ao cliente.","Também tenho experiência como mentora. Já orientei PMs júnior em como priorizar, estruturar o trabalho e dar um passo atrás quando as coisas apertam.","Inglês é meu idioma de trabalho. Colaboro com colegas da África, da Europa e das Américas do Norte e do Sul."],
born:"Nasci em Belém, na Amazônia brasileira.",
prh:"Princípios e modo de trabalho",
pr:[["Entender o problema antes de deixar bonito.","Antes de abrir o Figma, leio a regulação, sento com a operação e olho como o sistema é construído. Você vai ver um rascunho meu um pouco mais tarde. Em troca, a gente concorda sobre o problema antes de discutir tela."],["Desenhar junto com quem opera.","Antes de dar um fluxo como pronto, sento com quem vai operar: suporte, operação, subscrição. Eles sabem onde ele quebra. Dá mais conversa no começo e menos problema depois do lançamento."],["Checar antes de falar.","Antes de responder, olho o código e os dados. Se não chequei alguma coisa, eu aviso. Prefiro responder uma hora depois a responder errado."],["Prototipar do jeito que vai ao ar.","Construo com os engenheiros, em código. Assim os casos de borda esquisitos aparecem enquanto ainda são baratos. Leva mais tempo que uma tela estática. Mas ninguém leva susto na entrega."]],
exh:"Experiência e domínios",
ex:[["Insurtech e redes de corretores","Product design pra corretores, assessorias e ferramentas internas, da descoberta à entrega. Transformo regras de subscrição em fluxos que o corretor consegue vender e o cliente consegue seguir."],["Estratégia e consultoria de serviço","Ecossistemas, jornadas de cliente e pesquisa qualitativa pra Nestlé, Itaú e Santander."],["Sistemas regulados e cheios de regras","Em seguros, regulação, limites de subscrição e mudanças tributárias decidem o que uma interface pode dizer. Desenho dentro deles."]],
sph:"Prática e capacidades",
sp:[["Pesquisa de UX e descoberta","Entrevistas, acompanhamento de operação, leitura de conversas reais, mapas de jornada, blueprints de serviço, jobs to be done e pesquisas. Organizo o que aprendo antes de abrir um layout."],["Estratégia de produto","PRDs, prioridades, trade-offs, roadmaps e métricas de sucesso, cada uma com uma definição clara."],["Product design","UX e UI pra web e mobile: fluxos, estados e casos de borda, além de textos, protótipos, handoff e QA de design."],["Construir com engenheiros","Claude Code, Git, Docker, React e HTML/CSS, além de consultas ao data warehouse pra testar decisões. Os engenheiros revisam o que escrevo."]],
aend:"Vamos conversar sobre o seu próximo problema de produto.",
ch1:"Vamos conversar sobre desafios complexos de produto.",
csub:"Desenho produtos de seguros e fintech em que regras, parceiros e código moldam a decisão. Estou aberta a posições sênior, consultoria e parcerias de design desde o início. Me conte no que você está trabalhando.",
hh:"Me chama quando…",
hp:[["…ninguém concorda sobre qual é o problema.","Converso com as pessoas, leio as regras e volto com uma definição que todo mundo assina. Junto vêm um roadmap e os casos de teste."],["…a decisão precisa de evidência pra se sustentar.","Ligo a pesquisa à escolha que está na mesa e escrevo os trade-offs. Assim a prioridade fica fácil de defender."],["…o design precisa sobreviver à engenharia.","Prototipo em código, ao lado dos engenheiros. Já coloquei em produção código revisado por eles. Na entrega, ninguém leva susto."],["…as regras são rígidas e o fluxo ainda precisa ser gostoso de usar.","Jurídico, subscrição, regulação. Desenho fluxos que passam na revisão e que as pessoas gostam de usar."]],

const META={assist:["Insurtech · Mobile app","Insurtech · App mobile"],annual:["Insurtech · Car insurance","Insurtech · Seguro auto"],renewal:["Insurtech · Car insurance","Insurtech · Seguro auto"],assessorias:["Insurtech · Car insurance","Insurtech · Seguro auto"],account:["Insurtech · Car insurance","Insurtech · Seguro auto"],onboarding:["Insurtech · Car insurance","Insurtech · Seguro auto"],itau:["Banking · Debt recovery","Banco · Recuperação de dívida"],nestle:["Consumer goods","Bens de consumo"],santander:["Banking · Loyalty","Banco · Fidelidade"]};
const FEAT=["renewal","assessorias","assist"];
let lang="en",route=location.hash.slice(1);
const CS=()=>lang==="pt"?CASES.map(c=>{const p=PT[c.id];return {...c,...p,stats:c.stats&&c.stats.map((s,i)=>[s[0],p.sc[i]])}}):CASES;

const fmt=n=>lang==="pt"?String(n).replace(".",",")+"%":n+"%";

function home(L){

  const row=c=>`<a href="#${c.id}" data-k="feat" data-cur="${L.read}"><small>${area(c)}</small><span class="t">${c.title}</span><span class="d">${c.card}</span><span class="r">${c.pv}</span></a>`;

  return `<p class="k">${x.kicker}</p><h1>${x.h1}</h1><p class="sub">${x.sub}</p>

<section class="sec"><h2 class="sh"><i>02</i>${x.sh2}</h2><ol class="rows mini">${r.map(c=>`<li>${mini(c)}</li>`).join("")}</ol></section>
<section class="sec"><h2 class="sh"><i>03</i>${x.sh3}</h2><p class="lead">${x.bgl}</p>
<div class="flow">${x.flow.map(f=>`<div><b class="serif">${f[0]}</b><p>${f[1]}</p></div>`).join("")}</div>
<p><a href="#about" data-cur="${L.open}">${x.more}</a></p></section>
<section class="sec"><h2 class="lead">${x.cta1}</h2><p>${x.cta2}</p><a class="lk" href="#contact" data-cur="${L.open}">${L.cta}</a></section>`}
function view(L,c){
  const all=CS(),i=all.findIndex(x=>x.id===c.id),n=all[(i+1)%all.length];
  const prof=x=>`<div class="prof">${x.map(p=>`<div><b>${p[0]}</b><span>${p[1]}</span><i>${p[2]}</i></div>`).join("")}</div>`;
  const sec=(l,h,t,x)=>t?`<section class="cs"><p class="cl">${l}</p><h2>${h||l}</h2><p>${t}</p>${x?prof(x):""}</section>`:"";
  const st=c.stats?`<div class="stats">${c.stats.map(s=>`<div class="stat"><b>${fmt(s[0])}</b><span>${s[1]}</span><i class="bar" style="--w:${parseFloat(s[0])}%"></i></div>`).join("")}</div>`:"";
  const dec=`<section class="cs"><p class="cl">${L.sec[3]}</p><h2>${c.hdec||L.sec[3]}</h2>${(c.shots||[]).map(f=>`<figure class="shot${f[3]?" "+f[3]:""}"><img src="${f[0]}" alt="${f[1]}" loading="lazy"><figcaption>${f[2]}</figcaption></figure>`).join("")}<div class="decs">${c.dec.map(d=>`<div class="dec"><b>${d[0]}</b>${d[1]?`<p><span>${L.ins}</span>${d[1]}</p>`:""}<p><span>${L.bec}</span>${d[2]}</p></div>`).join("")}</div></section>`;
  return `<p class="k">${area(c)}</p><h1 style="font-size:clamp(2rem,6vw,3rem)">${c.title}</h1><p class="meta">${c.meta}</p><p class="sum">${c.intro}</p>${st}${c.quote?`<blockquote class="pq">${c.quote}</blockquote>`:""}${sec(L.sec[0],c.hctx,c.ctx)}${sec(L.sec[1],c.hrole,c.role)}${sec(L.sec[2],c.happ,c.app,c.prof)}${dec}${sec(L.sec[4],c.hout,c.out)}${sec(L.sec[5],c.href,c.ref)}<a class="next" href="#${n.id}">${n.title}</a>`}
function about(L){
  const x=X[lang];
  const star='<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="g2" x1="3" y1="2" x2="21" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF9A6E"/><stop offset=".5" stop-color="#F94615"/><stop offset="1" stop-color="#C4300A"/></linearGradient></defs><path fill="url(#g2)" d="M12 0C12 6.6 17.4 12 24 12C17.4 12 12 17.4 12 24C12 17.4 6.6 12 0 12C6.6 12 12 6.6 12 0Z"/></svg>';
  return `<p class="k">${x.ak}</p><h1>${x.ah}</h1>
<figure class="ph">${star}<div class="frame"><img src="${PHOTO}" alt="${x.photoAlt}"></div></figure>
<p class="sum">${x.asum}</p><div class="ab">${x.ap.map(t=>`<p>${t}</p>`).join("")}<p class="k">${x.born}</p></div>
<section class="sec"><h2 class="sh"><i>01</i>${x.prh}</h2>${x.pr.map(p=>`<details class="pr" name="pr"><summary>${p[0]}</summary><div class="in"><p>${p[1]}</p></div></details>`).join("")}</section>
<section class="sec"><h2 class="sh"><i>02</i>${x.exh}</h2><div class="dom">${x.ex.map(e=>`<p><b>${e[0]}</b>${e[1]}</p>`).join("")}</div></section>
<section class="sec"><h2 class="sh"><i>03</i>${x.sph}</h2><div class="spec">${x.sp.map(e=>`<div><b class="serif">${e[0]}</b><p>${e[1]}</p></div>`).join("")}</div></section>
<section class="sec"><h2 class="lead">${x.aend}</h2><a class="lk" href="#contact" data-cur="${L.open}">${L.cta}</a></section>`}
function contact(L){
  const x=X[lang],E="contactlu@icloud.com",LI="linkedin.com/in/lu-moraes";
  return `<h1>${x.ch1}</h1><p class="sub">${x.csub}</p>
<section class="sec"><div class="chan"><p><a href="mailto:${E}">${E}</a><button data-copy="${E}">${L.copy}</button></p><p><a href="https://${LI}/" rel="noopener">LinkedIn</a></p></div></section>
<section class="sec"><h2 class="lead">${x.hh}</h2><div class="hlp">${x.hp.map(p=>`<div class="hc"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0C12 6.6 17.4 12 24 12C17.4 12 12 17.4 12 24C12 17.4 6.6 12 0 12C6.6 12 12 6.6 12 0Z"/></svg><b>${p[0]}</b><p>${p[1]}</p></div>`).join("")}</div><p class="hend">${x.hend}</p></section>`}
const app=document.getElementById("app"),cur=document.getElementById("cur"),pv=document.getElementById("pv"),prog=document.getElementById("prog");
function render(){
  const L=I[lang],x=X[lang],c=byId(route);
  document.documentElement.lang=lang==="pt"?"pt-BR":"en";
  app.innerHTML=c?view(L,c):route==="about"?about(L):route==="contact"?contact(L):home(L);
  document.querySelectorAll("#nav a").forEach((a,i)=>{a.textContent=L.nav[i];a.setAttribute("aria-current",(i===0&&(c||!route))||(i===1&&route==="about")||(i===2&&route==="contact")?"page":"false")});
  document.getElementById("f1").textContent=x.f1;document.getElementById("f2").innerHTML=x.f2;
  document.title=(c?c.title:route==="about"?x.ah:route==="contact"?L.nav[2]:"Lu Moraes")+(c||route?" | Lu Moraes":"");
  window.scrollTo(0,0);reset();
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.6});
  app.querySelectorAll(".stat,.flow>div").forEach(s=>io.observe(s));
}
function go(id){
  const w=id==="work";
  // remember where the reader was, then add a history entry so the browser's back button works
  try{history.replaceState({y:scrollY},"");history.pushState({y:0},"","#"+id)}catch(_){}
  route=w?"":id;
  render();
  if(w){const e=document.getElementById("work");if(e)e.scrollIntoView()}
}
function restore(e){
  const r=location.hash.slice(1),next=r==="work"?"":r;
  if(next===route&&e.type==="hashchange")return;
  route=next;render();
  const y=e.state&&typeof e.state.y==="number"?e.state.y:null;
  if(y!==null)requestAnimationFrame(()=>scrollTo(0,y));
  else if(r==="work"){const w=document.getElementById("work");if(w)w.scrollIntoView()}
}
function reset(){cur.className="cur";cur.textContent="";pv.classList.remove("on");pv.classList.remove("mi")}
const ring=t=>{const r=(t+" · ").toUpperCase().repeat(2);return `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><path id="curp" d="M50,50 m-38,0 a38,38 0 1,1 76,0 a38,38 0 1,1 -76,0"/></defs><text textLength="236" lengthAdjust="spacing"><textPath href="#curp">${r}</textPath></text></svg><span>↗</span>`};
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.querySelectorAll(".lang button").forEach(y=>y.setAttribute("aria-pressed",y===b));render()});
document.addEventListener("click",e=>{
  const cp=e.target.closest("[data-copy]");
  if(cp){if(navigator.clipboard)navigator.clipboard.writeText(cp.dataset.copy).catch(()=>{});cp.textContent=I[lang].copied;setTimeout(()=>cp.textContent=I[lang].copy,1400);return}
  const a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();go(a.getAttribute("href").slice(1));
});
addEventListener("popstate",restore);
addEventListener("hashchange",restore);
document.addEventListener("mouseover",e=>{
  const a=e.target.closest&&e.target.closest("[data-cur]");
  if(!a){reset();return}
  const k=a.dataset.k||"";
  if(k&&cur.classList.contains(k))return;
  cur.className="cur big"+(k?" "+k:"");
  if(k==="feat")cur.innerHTML=ring(a.dataset.cur);else if(k==="mini")cur.textContent="→";else cur.textContent=a.dataset.cur;
  pv.classList.toggle("mi",k==="mini");
  if(a.dataset.pv){pv.textContent=a.dataset.pv;pv.classList.add("on")}else pv.classList.remove("on");
});
let mx=0,my=0,cx=0,cy=0,seen=0;
const calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
addEventListener("mousemove",e=>{document.documentElement.classList.add("pt");if(!seen){cx=e.clientX;cy=e.clientY;seen=1}mx=e.clientX;my=e.clientY;pv.style.transform=`translate(${mx+22}px,${my+18}px)`;const st=document.querySelector(".star");if(st&&!calm){const r=st.getBoundingClientRect();st.style.transform=`rotate(${Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI+90}deg)`}});
(function loop(){cx+=(mx-cx)*(calm?1:.22);cy+=(my-cy)*(calm?1:.22);cur.style.transform=`translate(${cx}px,${cy}px)`;requestAnimationFrame(loop)})();
addEventListener("scroll",()=>{const h=document.documentElement.scrollHeight-innerHeight;prog.style.transform=`scaleX(${h>0?scrollY/h:0})`},{passive:true});
let t;addEventListener("keydown",e=>{if(e.key.toLowerCase()==="o"&&!e.metaKey&&!e.ctrlKey){document.documentElement.classList.add("alt");clearTimeout(t);t=setTimeout(()=>document.documentElement.classList.remove("alt"),3000)}});
render();
</script>
